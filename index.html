<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0920" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Bolão privado da Champions League" />
    <title>Champions Bolão</title>
    <script>
      (() => {
        const isMobileHome = () => (window.location.pathname === '/dashboard' || window.location.pathname === '/')
          && window.matchMedia?.('(max-width: 820px)').matches
        const isMobileLogin = () => window.location.pathname === '/login'
          && window.matchMedia?.('(max-width: 680px)').matches
        const navigation = performance.getEntriesByType?.('navigation')?.[0]
        const isReload = navigation?.type === 'reload' || (!navigation && performance.navigation?.type === 1)

        if (isMobileLogin() && isReload) {
          const previousScrollRestoration = 'scrollRestoration' in history
            ? history.scrollRestoration
            : null
          const startLoginAtTop = () => window.scrollTo(0, 0)
          const restoreScrollRestoration = () => {
            if (previousScrollRestoration !== null) history.scrollRestoration = previousScrollRestoration
          }

          if (previousScrollRestoration !== null) history.scrollRestoration = 'manual'
          document.addEventListener('DOMContentLoaded', startLoginAtTop, { once: true })
          window.addEventListener('pageshow', (event) => {
            if (!event.persisted) startLoginAtTop()
          }, { once: true })
          window.addEventListener('pagehide', restoreScrollRestoration, { once: true })
          window.addEventListener('popstate', restoreScrollRestoration, { once: true })
        }

        if (isMobileHome() && isReload) {
          const storageKey = `champions-home-scroll:${window.location.pathname}${window.location.search}`
          let position = { x: 0, y: 0 }
          try {
            const savedPosition = JSON.parse(sessionStorage.getItem(storageKey) || 'null')
            if (Number.isFinite(savedPosition?.x) && Number.isFinite(savedPosition?.y)) position = savedPosition
          } catch {
            // An unavailable or invalid session value should start the Home at its top.
          }

          history.scrollRestoration = 'manual'
          window.__championsHomeReloadScroll = { storageKey, position }
        }

        window.addEventListener('pagehide', () => {
          if (!isMobileHome()) return
          const storageKey = `champions-home-scroll:${window.location.pathname}${window.location.search}`
          const body = document.body
          const fixedBodyTop = body && getComputedStyle(body).position === 'fixed'
            ? Number.parseFloat(body.style.top)
            : Number.NaN
          const y = Number.isFinite(fixedBodyTop) ? Math.max(0, -fixedBodyTop) : window.scrollY
          try {
            sessionStorage.setItem(storageKey, JSON.stringify({ x: window.scrollX, y }))
          } catch {
            // Scroll restoration remains safe if storage is unavailable.
          }
        }, { once: true })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
